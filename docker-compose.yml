# docker compose up --build   (needs a .env with APP_ENCRYPTION_KEY, see .env.example)
# Single API process with SQLite; background jobs run in-process (no Redis needed).
services:
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/zodypay.db
      TRUST_PROXY: 'true'
    volumes: [zodypay-data:/data]
    ports: ['4000:4000']
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    ports: ['3000:3000']
    depends_on: [api]
    restart: unless-stopped

volumes:
  zodypay-data:
